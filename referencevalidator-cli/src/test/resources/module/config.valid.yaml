# =============================================================================
# PROFILE FAMILIES: the runtime lookup structure.
# A family answers: "given profile URL + version + date, which packageGroupName?"
#
# Per version:
#   groups : ordered list; FIRST period containing the reference
#                     date wins (overlaps allowed, order = priority).
#                     The single OPEN-ENDED entry (no validTill) is the
#                     currently active group and is used when no reference
#                     date can be determined. If all entries are closed,
#                     a missing date is a validation error.
# Per family:
#   defaultVersion  : used when the canonical carries no "|version".
# =============================================================================
