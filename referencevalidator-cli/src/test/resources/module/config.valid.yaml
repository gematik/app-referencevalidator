configSpecVersion: '3.0'
name: erp
author: 'gematik GmbH'
description: 'Reference Validator Plugin for the electronic prescription (e-Rezept)'
version: '3.0'
errorOnUnknownProfile: true
anyExtensionsAllowed: false

ignoredCodeSystems:
  - "http://fhir.de/CodeSystem/ifa/pzn"
  - "http://fhir.de/CodeSystem/ask"
  - "http://fhir.de/CodeSystem/bfarm/atc"                                                              # epa-Medication
  - "http://snomed.info/sct"                                                                           # epa-Medication
  - "https://terminologieserver.bfarm.de/fhir/CodeSystem/arzneimittel-referenzdaten-pharmazeutisches-produkt" # epa-Medication

ignoredValueSets:
  - "http://hl7.org/fhir/uv/ips/ValueSet/medicine-doseform" # epa-Medication

globalSuppressionRules:
  - ruleId: "ERP-SLICE-METAPROFILE-001"
    messagePattern: ".*does not match any known slice.*meta.profile.*"
    reason: "Known transition issue for multiple meta.profile entries in e-Rezept context"
  - ruleId: "ERP-SLICE-METAPROFILE-002"
    messagePattern: .*stimmt mit keinem bekannten Slice.*meta.profile.*
    reason: "Known transition issue for multiple meta.profile entries in e-Rezept context"
  - ruleId: "GLOBAL-SORT-001"
    messagePattern: ".*__sorted.*"
    reason: "Sort-order warnings not actionable"
  - ruleId: "COUNTRY-ISO-INFO"
    messagePattern: ".*iso3166-1-2.*code 'D'.*"
    reason: "Known legacy country code handling"

# =============================================================================
# MESSAGE TRANSFORMATIONS: reusable severity-rewrite rules,
# referenced by name from packageGroups
# =============================================================================
messageTransformations:
  # Obwohl die Profile mehrfache meta.profile-Angaben technisch zulassen, wurden
  # diese bis auf Weiteres für die Verwendung im E-Rezept-Kontext verboten
  meta_profile_slice_to_error:
    - severityLevelFrom: "information"
      severityLevelTo: "error"
      locatorString: "does not match any known slice"
      messageLocationRegex: "meta.profile"
    - severityLevelFrom: "information"
      severityLevelTo: "error"
      locatorString: "stimmt mit keinem bekannten Slice"
      messageLocationRegex: "meta.profile"

  bundle_multiple_profiles_to_info:
    - severityLevelFrom: "error"
      severityLevelTo: "information"
      messageId: "BUNDLE_BUNDLE_ENTRY_MULTIPLE_PROFILES"

  # Legacy fixes for ABDA 1.0.3
  dav_abda_103_fixes:
    - severityLevelFrom: "error"
      severityLevelTo: "information"
      locatorString: "http:\\/\\/fhir\\.abda\\.de\\/Identifier\\/DAV-Herstellerschluessel['\"][^'\"]+['\"]http:\\/\\/fhir\\.de\\/NamingSystem\\/arge-ik\\/iknr"
      messageId: "_DT_Fixed_Wrong"
    - severityLevelFrom: "error"
      severityLevelTo: "information"
      locatorString: "http://fhir.abda.de/eRezeptAbgabedaten/StructureDefinition/DAV-PR-ERP-ZusatzdatenEinheit"
      messageId: "Reference_REF_CantMatchChoice"
    - severityLevelFrom: "error"
      severityLevelTo: "information"
      locatorString: "http://fhir.abda.de/eRezeptAbgabedaten/StructureDefinition/DAV-PR-ERP-ZusatzdatenHerstellung"
      messageId: "Reference_REF_CantMatchChoice"
    - severityLevelFrom: "error"
      severityLevelTo: "information"
      locatorString: "http://fhir.abda.de/eRezeptAbgabedaten/StructureDefinition/DAV-PR-Base-ZusatzdatenHerstellung"
      messageId: "Reference_REF_CantMatchChoice"
    - severityLevelFrom: "error"
      severityLevelTo: "information"
      locatorString: "http://fhir.abda.de/eRezeptAbgabedaten/StructureDefinition/DAV-PR-ERP-ZusatzdatenEinheit"
      messageId: "Validation_VAL_Profile_NotSlice"

